name: Mobile & Desktop CI/CD (Android, iOS & macOS)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'mob-ui/**'
      - '.github/workflows/mob-ui.yml'
    tags:
      - 'mob-v*'
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'mob-ui/**'
      - '.github/workflows/mob-ui.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      build_android:
        description: 'Build Android APKs and Bundle'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS App (.ipa / .zip)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS Desktop App (.dmg / .zip)'
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release with artifacts (manual runs)'
        type: boolean
        default: false

concurrency:
  group: mob-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    name: 🧪 Mobile Tests & Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mob-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mob-ui/.dart_tool
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('mob-ui/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

  build-android:
    name: 🤖 Build Android APKs & Bundle
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_android != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mob-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mob-ui/.dart_tool
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('mob-ui/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split APKs (per ABI Platform)
        run: |
          BUILD_MODE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building split APKs for mode: $BUILD_MODE"
          flutter build apk --split-per-abi --$BUILD_MODE

      - name: Build Universal APK
        run: |
          BUILD_MODE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building universal APK for mode: $BUILD_MODE"
          flutter build apk --$BUILD_MODE

      - name: Build Android App Bundle (.aab)
        run: |
          BUILD_MODE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building App Bundle for mode: $BUILD_MODE"
          flutter build appbundle --$BUILD_MODE

      - name: Organize Android Artifacts
        run: |
          mkdir -p dist/android
          BUILD_MODE="${{ github.event.inputs.build_type || 'release' }}"

          # Copy ABI-split APKs
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-$BUILD_MODE.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-armeabi-v7a-$BUILD_MODE.apk" dist/android/vanika-android-armeabi-v7a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-$BUILD_MODE.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-$BUILD_MODE.apk" dist/android/vanika-android-arm64-v8a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-$BUILD_MODE.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-x86_64-$BUILD_MODE.apk" dist/android/vanika-android-x86_64.apk
          fi

          # Copy Universal APK
          if [ -f "build/app/outputs/flutter-apk/app-$BUILD_MODE.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-$BUILD_MODE.apk" dist/android/vanika-android-universal.apk
          fi

          # Copy App Bundle if present
          if [ -f "build/app/outputs/bundle/$BUILD_MODE/app-$BUILD_MODE.aab" ]; then
            cp "build/app/outputs/bundle/$BUILD_MODE/app-$BUILD_MODE.aab" dist/android/vanika-android.aab
          fi

          # Checksums
          cd dist/android
          sha256sum * > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanika-android-artifacts
          path: mob-ui/dist/android/*
          retention-days: 14

  build-ios:
    name: 🍎 Build iOS App
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_ios != 'false' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mob-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: |
          BUILD_MODE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building iOS app for mode: $BUILD_MODE"
          flutter build ios --no-codesign --$BUILD_MODE

      - name: Package iOS Artifacts
        run: |
          mkdir -p dist/ios

          # Create Payload structure for .ipa
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r dist/ios/vanika-ios-unsigned.ipa Payload

          # Also create .zip of Runner.app
          cd build/ios/iphoneos
          zip -r ../../../dist/ios/vanika-ios-Runner.app.zip Runner.app
          cd ../../..

          cd dist/ios
          sha256sum * > SHA256SUMS-ios.txt
          cat SHA256SUMS-ios.txt

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanika-ios-artifacts
          path: mob-ui/dist/ios/*
          retention-days: 14

  build-macos:
    name: 💻 Build macOS Desktop App
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_macos != 'false' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mob-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: |
          BUILD_MODE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building macOS desktop app for mode: $BUILD_MODE"
          flutter build macos --$BUILD_MODE

      - name: Package macOS Artifacts (.dmg and .zip)
        run: |
          mkdir -p dist/macos
          BUILD_MODE="${{ github.event.inputs.build_type || 'release' }}"
          APP_PATH="build/macos/Build/Products/Release/mob_ui.app"
          if [ "$BUILD_MODE" = "debug" ]; then
            APP_PATH="build/macos/Build/Products/Debug/mob_ui.app"
          fi

          # Create native macOS Disk Image (.dmg)
          hdiutil create -volname "Vanika" -srcfolder "$APP_PATH" -ov -format UDZO dist/macos/vanika-macos.dmg

          # Also create .zip archive
          zip -r dist/macos/vanika-macos.app.zip "$APP_PATH"

          cd dist/macos
          sha256sum * > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanika-macos-artifacts
          path: mob-ui/dist/macos/*
          retention-days: 14

  publish-summary-and-release:
    name: 🚀 Publish Summary & Release
    needs: [build-android, build-ios, build-macos]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Generate Consolidated Step Summary
        run: |
          mkdir -p final-artifacts
          find all-dist -type f -exec cp {} final-artifacts/ \;
          cd final-artifacts
          sha256sum * > SHA256SUMS-all.txt 2>/dev/null || true

          echo "### 📱 Vanika Multi-Platform Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Artifact Name | Description | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          # Android entries
          if [ -f "vanika-android-arm64-v8a.apk" ]; then
            SIZE=$(du -h vanika-android-arm64-v8a.apk | cut -f1)
            echo "| Android | \`vanika-android-arm64-v8a.apk\` | **ARM 64-bit** (Modern phones) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "vanika-android-armeabi-v7a.apk" ]; then
            SIZE=$(du -h vanika-android-armeabi-v7a.apk | cut -f1)
            echo "| Android | \`vanika-android-armeabi-v7a.apk\` | **ARM 32-bit** (Legacy phones) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "vanika-android-x86_64.apk" ]; then
            SIZE=$(du -h vanika-android-x86_64.apk | cut -f1)
            echo "| Android | \`vanika-android-x86_64.apk\` | **x86 64-bit** (Emulators/Tablets) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "vanika-android-universal.apk" ]; then
            SIZE=$(du -h vanika-android-universal.apk | cut -f1)
            echo "| Android | \`vanika-android-universal.apk\` | **Universal APK** (All architectures) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "vanika-android.aab" ]; then
            SIZE=$(du -h vanika-android.aab | cut -f1)
            echo "| Android | \`vanika-android.aab\` | **Play Store Bundle** (Google Play) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi

          # iOS entries
          if [ -f "vanika-ios-unsigned.ipa" ]; then
            SIZE=$(du -h vanika-ios-unsigned.ipa | cut -f1)
            echo "| iOS | \`vanika-ios-unsigned.ipa\` | **iOS Package** (Unsigned IPA) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "vanika-ios-Runner.app.zip" ]; then
            SIZE=$(du -h vanika-ios-Runner.app.zip | cut -f1)
            echo "| iOS | \`vanika-ios-Runner.app.zip\` | **iOS App Bundle** (.app archive) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi

          # macOS entries
          if [ -f "vanika-macos.dmg" ]; then
            SIZE=$(du -h vanika-macos.dmg | cut -f1)
            echo "| macOS | \`vanika-macos.dmg\` | **macOS Disk Image** (Native installer) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "vanika-macos.app.zip" ]; then
            SIZE=$(du -h vanika-macos.app.zip | cut -f1)
            echo "| macOS | \`vanika-macos.app.zip\` | **macOS App Archive** (.app.zip) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔒 Checksums (SHA-256)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS-all.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/mob-v') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: final-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
