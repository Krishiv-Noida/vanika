name: Web App CI/CD (Next.js)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'web-ui/**'
      - '.github/workflows/web-ui.yml'
    tags:
      - 'web-v*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'web-ui/**'
      - '.github/workflows/web-ui.yml'
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Build Next.js Production Bundle'
        type: boolean
        default: true

concurrency:
  group: web-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Type Check
        run: npm run type-check

  build:
    name: 🏗️ Build Next.js Web App
    needs: lint-and-typecheck
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_build != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://user:password@localhost:5432/vanika
      NEXTAUTH_SECRET: ci-secret-placeholder
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js App
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanika-web-build
          path: web-ui/.next/
          retention-days: 7
